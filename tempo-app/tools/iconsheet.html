<!doctype html><meta charset=utf-8><title>icons</title>
<style>
 body{background:#171717;color:#ececec;font:11px Inter,system-ui;margin:0;padding:20px}
 .g{display:grid;grid-template-columns:repeat(9,1fr);gap:18px}
 .c{display:flex;flex-direction:column;align-items:center;gap:8px}
 .big{width:32px;height:32px;color:#ececec}
 .sml{display:flex;gap:10px;align-items:center;color:#9a9a9a}
 .s16{width:16px;height:16px}.s13{width:13px;height:13px}
 svg{width:100%;height:100%}
 .n{color:#8a8a8a;font-size:10px}
</style>
<div class=g id=g></div>
<script type="module">
import { ICONS } from "../src/ui/icons.js";
const g=document.getElementById("g");
for(const [k,v] of Object.entries(ICONS)){
  const c=document.createElement("div");c.className="c";
  c.innerHTML=`<div class="big">${v}</div><div class="sml"><span class="s16">${v}</span><span class="s13">${v}</span><span>Aa</span></div><div class="n">${k}</div>`;
  g.append(c);
}
</script>
