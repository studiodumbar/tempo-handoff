<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TEMPO · Motion</title>
<link rel="stylesheet" href="./styles.css" />
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <canvas id="view"></canvas>
      <div class="stage-label"></div>
    </div>
  </div>

  <div id="drop"><div>Drop the .glb — it joins the asset library</div></div>
  <input id="file" type="file" accept=".glb,.gltf,.png,.jpg,.jpeg,.svg" multiple hidden />
  <input id="projfile" type="file" accept=".json" hidden />

  <div id="fatal" hidden>
    <div>
      <h1>WebGL2 required</h1>
      <p>This studio needs a WebGL2-capable browser (Chrome, Firefox, Safari 16+).</p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
