<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hatch sequence</title>
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./journey.css" />
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
  <!-- the editor's own anatomy: centred stage, floating right panel,
       floating bottom panel — Sequence is a MODE of the tool, not a site -->
  <div id="viewport">
    <div id="stage">
      <canvas id="view"></canvas>
      <div class="stage-label"></div>
    </div>
  </div>

  <div class="panel right-panel" id="jpanel"></div>

  <div class="panel timeline-panel" id="jseq">
    <div class="seq-top">
      <div id="jstatus"></div>
      <button id="jrun-btn" class="btn subtle"></button>
    </div>
    <nav id="jsteps"></nav>
  </div>

  <div id="fatal" hidden>
    <div>
      <h1>WebGL2 required</h1>
      <p>This studio needs a WebGL2-capable browser (Chrome, Firefox, Safari 16+).</p>
    </div>
  </div>

  <script type="module" src="./src/journey.js"></script>
</body>
</html>
