<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEMPO · Final helix to grid · Option 1</title>
  <style>
    :root { color-scheme: dark; font: 12px/1.5 system-ui, sans-serif; background: #101010; color: white; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header, footer { position: fixed; z-index: 3; left: 0; right: 0; padding: 16px 24px; background: #101010ed; display: flex; align-items: center; gap: 12px; }
    header { top: 0; } footer { bottom: 0; }
    header span { color: #aaa; } #status { margin-left: auto; }
    #grid { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 22px 24px; height: 100svh; min-height: 640px; padding: 138px 28px 120px; overflow: hidden; }
    #grid:not([data-ready]) { visibility: hidden; }
    figure { margin: 0; min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) 24px; gap: 8px; }
    img { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; }
    figcaption { opacity: 0; color: #aaa; border-bottom: 1px solid #292929; }
    #grid[data-complete] figcaption { opacity: 1; }
    button, input { font: inherit; }
    button { padding: 7px 12px; border: 1px solid #444; border-radius: 4px; background: #252525; color: white; cursor: pointer; white-space: nowrap; }
    button:disabled { opacity: .4; cursor: wait; }
    #play { background: #eee; color: #111; }
    button:focus-visible, input:focus-visible { outline: 2px solid #0d99ff; outline-offset: 3px; }
    label { flex: 1; display: flex; align-items: center; gap: 10px; color: #aaa; }
    input { width: 100%; min-width: 40px; accent-color: #eee; }
    output { min-width: 110px; text-align: right; color: #aaa; font-variant-numeric: tabular-nums; }
    #error { position: fixed; z-index: 4; top: 60px; left: 24px; right: 24px; color: #ffd4bd; }
    @media (max-width: 700px) {
      header, footer { padding: 12px; flex-wrap: wrap; gap: 8px; }
      #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; padding: 90px 16px 140px; min-height: 700px; }
      label { min-width: 100%; order: 5; } output { margin-left: auto; }
    }
  </style>
</head>
<body>
  <header><strong>TEMPO</strong><span>Helix → grid · Final option 1</span><span id="status" role="status">Preparing</span></header>
  <p id="error" role="alert" hidden></p>
  <main id="grid" aria-label="Product grid">
    <figure><img data-product-image src="example-assets/tshirt.png" alt="T-shirt"><figcaption>T-shirt</figcaption></figure>
    <figure><img data-product-image src="example-assets/longsleeve.png" alt="Long sleeve"><figcaption>Long sleeve</figcaption></figure>
    <figure><img data-product-image src="example-assets/hoodie.png" alt="Hoodie"><figcaption>Hoodie</figcaption></figure>
    <figure><img data-product-image src="example-assets/bag.png" alt="Tote bag"><figcaption>Tote bag</figcaption></figure>
    <figure><img data-product-image src="example-assets/cap.png" alt="Cap"><figcaption>Cap</figcaption></figure>
    <figure><img data-product-image src="example-assets/water.png" alt="Water bottle"><figcaption>Water bottle</figcaption></figure>
  </main>
  <footer>
    <button id="play" disabled>Play reveal</button>
    <button id="pause" disabled>Pause</button>
    <button id="helix" disabled>Back to helix</button>
    <label>Scrub <input id="scrub" aria-label="Transition progress" type="range" min="0" max="1000" step="1" value="0" disabled></label>
    <output id="time">0.00 s</output>
  </footer>
  <script type="module">
    import { createTempoMerchTransition } from "./index.js";

    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const scrub = document.getElementById("scrub");
    const output = document.getElementById("time");
    let transition;
    let disposed = false;
    const cleanup = () => { disposed = true; transition?.destroy(); };
    window.addEventListener("pagehide", cleanup, { once: true });

    try {
      transition = await createTempoMerchTransition({
        root: grid,
        images: "[data-product-image]",
        onUpdate: (state) => {
          status.textContent = state.phase === "complete" ? "Grid" : state.phase === "helix" ? "Helix" : "Revealing";
          scrub.value = Math.round(state.progress * 1000);
          output.textContent = `${state.time.toFixed(2)} / ${state.duration.toFixed(2)} s`;
          grid.toggleAttribute("data-complete", state.phase === "complete");
        },
      });
      if (disposed) {
        transition.destroy();
      } else {
        grid.dataset.ready = "";
        document.querySelectorAll("footer button, footer input").forEach(control => { control.disabled = false; });
        document.getElementById("play").onclick = () => transition.play();
        document.getElementById("pause").onclick = () => transition.pause();
        document.getElementById("helix").onclick = () => transition.showHelix();
        scrub.oninput = () => transition.seek(Number(scrub.value) / 1000 * transition.duration);
      }
    } catch (error) {
      transition?.destroy();
      grid.dataset.ready = "";
      grid.dataset.complete = "";
      status.textContent = "Preview unavailable";
      const message = document.getElementById("error");
      message.hidden = false;
      message.textContent = error.message;
      console.error(error);
    }
  </script>
</body>
</html>
